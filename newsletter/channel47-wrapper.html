<style type="text/css">
  :root {
    color-scheme: light dark;
    supported-color-schemes: light dark;
  }

  .ch47-shell,
  .ch47-shell table,
  .ch47-shell td,
  .ch47-shell a {
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
  }

  .ch47-shell table {
    border-collapse: collapse;
    border-spacing: 0;
    mso-table-lspace: 0pt;
    mso-table-rspace: 0pt;
  }

  .ch47-shell img {
    -ms-interpolation-mode: bicubic;
  }

  .ch47-copy p {
    margin: 0 0 20px;
    line-height: 170%;
  }

  .ch47-copy h1,
  .ch47-copy h2,
  .ch47-copy h3 {
    color: #161718;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    margin: 28px 0 14px;
  }

  .ch47-copy h1 {
    font-size: 28px;
    line-height: 125%;
  }

  .ch47-copy h2 {
    font-size: 23px;
    line-height: 130%;
  }

  .ch47-copy h3 {
    font-size: 19px;
    line-height: 140%;
  }

  .ch47-copy ul,
  .ch47-copy ol {
    margin: 0 0 20px;
    padding-left: 24px;
  }

  .ch47-copy li,
  .ch47-copy blockquote {
    line-height: 170%;
  }

  .ch47-copy li {
    margin: 0 0 8px;
  }

  .ch47-copy blockquote {
    border-left: 3px solid #dddddc;
    margin: 24px 0;
    padding: 0 0 0 18px;
  }

  .ch47-copy a {
    color: #161718;
    text-decoration: underline;
  }

  .ch47-copy code {
    font-family: Consolas, 'Courier New', monospace;
    font-size: 90%;
    word-break: break-word;
  }

  .ch47-copy img {
    border: 0;
    display: block;
    height: auto;
    max-width: 100%;
    outline: none;
    text-decoration: none;
  }

  .ch47-shell a[x-apple-data-detectors] {
    color: inherit !important;
    font-family: inherit !important;
    font-size: inherit !important;
    line-height: inherit !important;
    text-decoration: inherit !important;
  }

  @media screen and (max-width: 600px) {
    .ch47-header {
      padding: 24px 20px 0 !important;
    }

    .ch47-copy {
      font-size: 16px !important;
      padding: 20px 20px 0 !important;
    }

    .ch47-byline {
      padding: 28px 20px 32px !important;
    }

    .ch47-footer {
      padding: 24px 20px 24px !important;
    }
  }

  @media (prefers-color-scheme: dark) {
    .ch47-shell,
    .ch47-surface,
    .ch47-header,
    .ch47-copy,
    .ch47-byline,
    .ch47-footer {
      background-color: #161718 !important;
    }

    .ch47-copy,
    .ch47-copy p,
    .ch47-copy h1,
    .ch47-copy h2,
    .ch47-copy h3,
    .ch47-copy li,
    .ch47-copy blockquote,
    .ch47-copy a,
    .ch47-footer-link,
    .ch47-footer-lead,
    .ch47-byline-name,
    .ch47-logo {
      color: #fdfdfc !important;
    }

    .ch47-muted,
    .ch47-footer {
      color: #b7b8b9 !important;
    }

    .ch47-rule-top {
      border-top-color: #404041 !important;
    }

    .ch47-copy blockquote {
      border-left-color: #404041 !important;
    }
  }

  [data-ogsc] .ch47-shell,
  [data-ogsc] .ch47-surface,
  [data-ogsc] .ch47-header,
  [data-ogsc] .ch47-copy,
  [data-ogsc] .ch47-byline,
  [data-ogsc] .ch47-footer {
    background-color: #161718 !important;
  }

  [data-ogsc] .ch47-copy,
  [data-ogsc] .ch47-copy p,
  [data-ogsc] .ch47-copy h1,
  [data-ogsc] .ch47-copy h2,
  [data-ogsc] .ch47-copy h3,
  [data-ogsc] .ch47-copy li,
  [data-ogsc] .ch47-copy blockquote,
  [data-ogsc] .ch47-copy a,
  [data-ogsc] .ch47-footer-link,
  [data-ogsc] .ch47-footer-lead,
  [data-ogsc] .ch47-byline-name,
  [data-ogsc] .ch47-logo {
    color: #fdfdfc !important;
  }

  [data-ogsc] .ch47-muted,
  [data-ogsc] .ch47-footer {
    color: #b7b8b9 !important;
  }
</style>
<table class="ch47-shell" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#fdfdfc" style="width:100%;border-collapse:collapse;background-color:#fdfdfc;table-layout:fixed;">
  <tr>
    <td align="center" valign="top" style="padding:0;">
      <!--[if mso]>
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" align="center">
        <tr>
          <td width="600" valign="top">
      <![endif]-->
      <table class="ch47-surface" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" align="center" bgcolor="#fdfdfc" style="width:100%;max-width:600px;border-collapse:collapse;background-color:#fdfdfc;">
        <tr>
          <td class="ch47-header" bgcolor="#fdfdfc" style="padding:28px 28px 0;background-color:#fdfdfc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
            <a href="https://channel47.dev" aria-label="Visit Channel 47" style="display:inline-block;color:#161718;text-decoration:none;">
              <img class="ch47-logo" src="https://channel47.dev/email/channel47-mark-v2.png" width="52" height="28" alt="47" style="display:block;width:52px;height:28px;border:0;outline:none;color:#161718;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:28px;text-decoration:none;" />
            </a>
          </td>
        </tr>
        <tr>
          <td class="ch47-copy" bgcolor="#fdfdfc" valign="top" style="padding:24px 28px 0;background-color:#fdfdfc;color:#161718;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:17px;line-height:170%;mso-line-height-rule:exactly;word-wrap:break-word;">
            {{ message_content }}
          </td>
        </tr>
        <tr>
          <td class="ch47-byline" bgcolor="#fdfdfc" style="padding:32px 28px 36px;background-color:#fdfdfc;color:#6d6f71;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:158%;mso-line-height-rule:exactly;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td width="44" valign="middle" style="width:44px;padding:0 14px 0 0;">
                  <img src="https://channel47.dev/jackson.jpeg" width="44" height="44" alt="Jackson Dean" style="display:block;width:44px;height:44px;border:0;border-radius:50%;outline:none;text-decoration:none;" />
                </td>
                <td valign="middle" style="padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
                  <p class="ch47-byline-name" style="margin:0;color:#161718;font-size:14px;font-weight:700;line-height:145%;mso-line-height-rule:exactly;">Jackson Dean</p>
                  <p class="ch47-muted" style="margin:2px 0 0;color:#6d6f71;font-size:12px;line-height:145%;mso-line-height-rule:exactly;">
                    <a class="ch47-footer-link" href="https://channel47.dev" style="color:#161718;text-decoration:underline;">channel47.dev</a>
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td class="ch47-footer ch47-rule-top" bgcolor="#fdfdfc" style="padding:28px 28px 28px;border-top:1px solid #dddddc;background-color:#fdfdfc;color:#6d6f71;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:158%;mso-line-height-rule:exactly;">
            <p class="ch47-footer-lead" style="margin:0 0 4px;color:#161718;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:150%;mso-line-height-rule:exactly;">Forwarded this email?</p>
            <p style="margin:0 0 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:158%;mso-line-height-rule:exactly;">
              <a class="ch47-footer-link" href="https://channel47.dev/newsletter?utm_source=forwarded_email&amp;utm_medium=email&amp;utm_campaign=channel47" style="color:#161718;text-decoration:underline;">Subscribe to Channel47 &rarr;</a>
            </p>
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td valign="middle" style="padding:0 18px 0 0;">
                  <a class="ch47-footer-link" href="https://x.com/ctrlswing" aria-label="X" style="display:inline-block;color:#161718;line-height:0;text-decoration:none;"><img src="https://channel47.dev/email/social-x-v2.png" width="20" height="20" alt="X" style="display:block;width:20px;height:20px;border:0;outline:none;text-decoration:none;" /></a>
                </td>
                <td valign="middle" style="padding:0 18px 0 0;">
                  <a class="ch47-footer-link" href="https://github.com/ctrlswing" aria-label="GitHub" style="display:inline-block;color:#161718;line-height:0;text-decoration:none;"><img src="https://channel47.dev/email/social-github-v2.png" width="20" height="20" alt="GitHub" style="display:block;width:20px;height:20px;border:0;outline:none;text-decoration:none;" /></a>
                </td>
                <td valign="middle" style="padding:0;">
                  <a class="ch47-footer-link" href="https://linkedin.com/in/ctrlswing" aria-label="LinkedIn" style="display:inline-block;color:#161718;line-height:0;text-decoration:none;"><img src="https://channel47.dev/email/social-linkedin-v2.png" width="20" height="20" alt="LinkedIn" style="display:block;width:20px;height:20px;border:0;outline:none;text-decoration:none;" /></a>
                </td>
              </tr>
              <tr>
                <td colspan="3" height="24" style="height:24px;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
            <p class="ch47-muted" style="margin:0;color:#6d6f71;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:11px;line-height:165%;mso-line-height-rule:exactly;">
              <a class="ch47-footer-link" href="{{ unsubscribe_url }}" style="color:#161718;text-decoration:underline;">Unsubscribe</a>
              <span style="padding:0 6px;color:#b2b3b4;">&middot;</span>
              {{ address }}
            </p>
          </td>
        </tr>
      </table>
      <!--[if mso]>
          </td>
        </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>
